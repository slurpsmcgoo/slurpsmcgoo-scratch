name: CI

on:
  push:
    paths: ["halloween/**", "kubb_game/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["halloween/**", "kubb_game/**", ".github/workflows/ci.yml"]

jobs:
  halloween:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halloween
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: halloween/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  kubb_game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubb_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: kubb_game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
