<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Window Show Remote</title>
  <style>
    :root {
      --bg: #0b0b0f; --panel: #16161d; --line: #2a2a35; --text: #ecebf2; --dim: #9b9aa8;
      --orange: #ff7a1a; --red: #ff3b3b; --green: #4fdc7a; --blue: #4fb3ff; --yellow: #ffd23a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      max-width: 520px; margin: 0 auto;
    }
    h1 { font-size: 18px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
    #conn { font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--panel); color: var(--dim); }
    #conn.ok { color: var(--green); }
    #conn.bad { color: #fff; background: var(--red); }
    #stale { display: none; background: var(--red); color: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; }
    .status { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
    .status div { min-width: 0; }
    .status .k { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .status .v { font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .state-idle { color: var(--dim); } .state-noticed { color: var(--yellow); } .state-engaged { color: var(--orange); }
    .state-scare { color: var(--red); } .state-cooldown { color: var(--blue); }
    .warn { color: var(--yellow); }
    button {
      font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 16px 10px; min-height: 56px; width: 100%; font-weight: 600; cursor: pointer;
    }
    button:active { transform: scale(0.98); filter: brightness(1.3); }
    button.on { background: #2b2b3a; border-color: var(--text); }
    #scare { background: var(--orange); border-color: var(--orange); color: #1a0a00; font-size: 22px; min-height: 84px; margin-bottom: 14px; }
    .row { display: grid; gap: 10px; margin-bottom: 10px; }
    .row.two { grid-template-columns: 1fr 1fr; }
    .row.three { grid-template-columns: 1fr 1fr 1fr; }
    #blackout.on { background: #000; border-color: var(--red); color: var(--red); }
    #pause.on { border-color: var(--yellow); color: var(--yellow); }
    .label { color: var(--dim); font-size: 13px; margin: 14px 2px 6px; }
    #scenes button { text-align: left; padding: 12px 14px; min-height: 48px; font-weight: 500; }
    #scenes button.active { border-color: var(--orange); color: var(--orange); }
    #scenes button:disabled { opacity: .35; }
    .sens { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center; }
    .sens span { text-align: center; font-size: 20px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Window Show <span id="conn">connecting…</span></h1>
  <div id="stale">The show page isn't responding. Check the laptop.</div>

  <div class="status">
    <div><div class="k">Scene</div><div class="v" id="s-scene">–</div></div>
    <div><div class="k">State</div><div class="v" id="s-state">–</div></div>
    <div><div class="k">People</div><div class="v" id="s-people">–</div></div>
    <div><div class="k">Sensors</div><div class="v" id="s-health">–</div></div>
  </div>

  <button id="scare">SCARE NOW</button>

  <div class="row two">
    <button id="prev">◀ Prev scene</button>
    <button id="next">Next scene ▶</button>
  </div>
  <div class="row two">
    <button id="blackout">Blackout</button>
    <button id="pause">Pause interaction</button>
  </div>

  <div class="label">Intensity</div>
  <div class="row three" id="intensity">
    <button data-level="gentle">Gentle</button>
    <button data-level="normal">Normal</button>
    <button data-level="full">Full</button>
  </div>

  <div class="label">Sensitivity</div>
  <div class="sens">
    <button id="sens-down">−</button>
    <span id="s-sens">0</span>
    <button id="sens-up">+</button>
  </div>

  <div class="label">Scenes</div>
  <div class="row" id="scenes"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let ws = null;
    let last = null;

    function send(command) {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'command', command }));
      if (navigator.vibrate) navigator.vibrate(15);
    }

    $('scare').onclick = () => send({ type: 'scareNow' });
    $('prev').onclick = () => send({ type: 'prevScene' });
    $('next').onclick = () => send({ type: 'nextScene' });
    $('blackout').onclick = () => send({ type: 'blackout', on: !(last && last.blackout) });
    $('pause').onclick = () => send({ type: 'pauseInteraction', on: !(last && last.paused) });
    $('sens-down').onclick = () => send({ type: 'sensitivity', delta: -1 });
    $('sens-up').onclick = () => send({ type: 'sensitivity', delta: 1 });
    for (const b of $('intensity').querySelectorAll('button')) b.onclick = () => send({ type: 'intensity', level: b.dataset.level });

    function render(msg) {
      const hb = msg.heartbeat;
      const stale = !msg.showConnected || msg.heartbeatAgeMs === null || msg.heartbeatAgeMs > 3000;
      $('stale').style.display = stale ? 'block' : 'none';
      if (!hb) return;
      last = hb;
      $('s-scene').textContent = hb.sceneTitle;
      const st = $('s-state');
      st.textContent = hb.state;
      st.className = 'v state-' + hb.state;
      $('s-people').textContent = hb.people;
      const h = hb.health || {};
      const hs = $('s-health');
      hs.textContent = `cam ${h.camera} · mic ${h.audio}`;
      hs.className = 'v' + (h.camera === 'ok' && h.audio === 'ok' ? '' : ' warn');
      $('s-sens').textContent = (hb.sensitivity > 0 ? '+' : '') + hb.sensitivity;
      $('blackout').classList.toggle('on', !!hb.blackout);
      $('blackout').textContent = hb.blackout ? 'Blackout ON' : 'Blackout';
      $('pause').classList.toggle('on', !!hb.paused);
      $('pause').textContent = hb.paused ? 'Interaction paused' : 'Pause interaction';
      for (const b of $('intensity').querySelectorAll('button')) b.classList.toggle('on', b.dataset.level === hb.intensity);
      const box = $('scenes');
      const key = JSON.stringify(hb.scenes) + hb.scene;
      if (box.dataset.key !== key) {
        box.dataset.key = key;
        box.innerHTML = '';
        for (const s of hb.scenes || []) {
          const b = document.createElement('button');
          b.textContent = s.title + (s.eligible ? '' : ' (sensor down)');
          b.disabled = !s.eligible;
          b.classList.toggle('active', s.id === hb.scene);
          b.onclick = () => send({ type: 'setScene', id: s.id });
          box.appendChild(b);
        }
      }
    }

    function connect() {
      const conn = $('conn');
      ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=remote`);
      ws.onopen = () => { conn.textContent = 'connected'; conn.className = 'ok'; };
      ws.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.type === 'status') render(m); } catch {} };
      ws.onclose = () => {
        conn.textContent = 'reconnecting…'; conn.className = 'bad';
        $('stale').style.display = 'block';
        setTimeout(connect, 2000);
      };
    }
    connect();
  </script>
</body>
</html>
